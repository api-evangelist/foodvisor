        status: 404
      - path: /.well-known/ai-plugin.json
        status: 404
      - path: /.well-known/agent-card.json
        status: 404
      - path: /.well-known/agent.json
        status: 404
  - host: api.foodvisor.io
    note: >-
      Live Django/CloudFront application host that answers 200 on / with an empty body
      and returns a real branded 404 page for unknown paths, so these 404s are genuine
      routing misses rather than a catch-all.
    documents:
      - path: /.well-known/security.txt
        status: 404
      - path: /.well-known/openid-configuration
        status: 404
      - path: /.well-known/oauth-authorization-server
        status: 404
