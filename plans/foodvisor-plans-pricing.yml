description: >-
  Foodvisor publishes NO API plans or API pricing. This file replaces a 2026-05-04
  scaffold that carried invented Free / Professional / Enterprise tiers with fabricated
  quotas (1,000 and 100,000 requests/month) and rate limits; none of those numbers were
  ever published by Foodvisor and they have been removed rather than corrected.
plans: []
note: >-
  HONEST ZERO. There is no API pricing page to read, because there is no longer a public
  API product: /en/vision/ returns 404 and vision.foodvisor.io is NXDOMAIN (see
  lifecycle/foodvisor-lifecycle.yml). Foodvisor does sell a consumer subscription
  ("Foodvisor Premium") through https://www.foodvisor.io/en/premium/, but that page is a
  client-rendered SPA whose translation bundle contains no hardcoded prices — amounts are
  fetched at runtime per market — and a consumer app subscription is not an API plan, so it
  is deliberately not recorded here as one. No Pricing pointer is wired into apis.yml.
