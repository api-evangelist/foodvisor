note: >-
  HONEST ZERO. No rate-limit documentation exists because the developer program itself is
  gone (see lifecycle/foodvisor-lifecycle.yml). Nothing was observed live either: the only
  reachable API host, api.foodvisor.io, returns an empty 200 on / and a branded 404 on every
  other anonymous path, emitting no RateLimit-*, X-RateLimit-* or Retry-After header. The
  private mobile-app backend behind that host is not a published API and was not probed.
