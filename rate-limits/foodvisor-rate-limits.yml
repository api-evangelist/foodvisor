description: >-
  Foodvisor publishes NO rate limits, quotas or throttling documentation. This file replaces
  a 2026-05-04 scaffold that asserted per-tier limits (10/100/1000 requests per minute,
  1,000 and 100,000 requests per month) and a full X-RateLimit-* header set, none of which
  Foodvisor ever published. Those invented values have been removed.
headers: {}
