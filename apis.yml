      and returned nutritional facts including calories and macronutrients. Endpoint and
      authentication details were issued to customers under a commercial agreement and no
      public OpenAPI specification was ever published. The product page and the
      documentation host have both been taken down; see the lifecycle artifact for the
      dated evidence.
