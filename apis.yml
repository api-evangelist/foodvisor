aid: foodvisor
name: Foodvisor
description: >-
  Foodvisor is a French mobile nutrition platform whose app identifies food items from a
  photograph using computer vision and returns nutritional information — calories,
  macronutrients and portion estimates. Between 2023 and 2025 Foodvisor also sold that
  capability to developers as the Foodvisor Vision API, a commercial image-recognition
  and nutrition-analysis service documented at vision.foodvisor.io. That developer
  product has since been withdrawn: the Vision product page now returns HTTP 404, the
  documentation host no longer resolves in DNS, and the live site carries no API,
  developer or enterprise content. Foodvisor today publishes no machine-readable
  contract, no SDK, no MCP server and no /.well-known document, and operates as a
  consumer subscription app.
